spring.application.name=backend


# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stark_vms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${SERVER_PORT:8080}

# JWT Configuration
# Required: Signing algorithm HS256, secret minimum 32 characters, token lifetime 3600 seconds.
# In production deployments, a cryptographically secure key must be provided via external configuration (e.g., JWT_SECRET environment variable).
app.jwt.secret=${JWT_SECRET:c3Rhcmstdm1zLXNlY3JldC1qd3Qta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LTI1NmJpdHM=}
app.jwt.expiration-seconds=3600

